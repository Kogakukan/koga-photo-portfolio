<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbfaf8" />
  <title>Antoine Photographie — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="./" aria-label="Accueil">
      <span class="brand-name">Antoine Photographie</span>
      <span class="brand-sub">portfolio</span>
    </a>

    <nav class="nav" aria-label="Navigation">
      <button class="nav-link is-active" data-view="gallery">Galerie</button>
      <button class="nav-link" data-view="collections">Collections</button>
    </nav>

    <div class="tools">
      <label class="search" aria-label="Rechercher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Rechercher" autocomplete="off" />
      </label>
      <button class="theme-toggle" id="themeToggle" aria-label="Changer de thème"><span></span></button>
    </div>
  </header>

  <main>
    <section class="view" id="view-gallery">
      <div class="filters" id="filters"></div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="view" id="view-collections" hidden>
      <div id="collections"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Antoine Photographie</span>
    <span id="footerYear"></span>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-stage" id="lbStage">
      <img id="lbImage" alt="" />
    </div>
    <aside class="lb-info">
      <p class="lb-place" id="lbPlace"></p>
      <p class="lb-date" id="lbDate"></p>
      <dl class="lb-meta" id="lbMeta"></dl>
      <p class="lb-counter" id="lbCounter"></p>
    </aside>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Fermer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Photo précédente">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Photo suivante">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
